# Restarts pods when their ConfigMap or Secret changes (for example RDS password rotation).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: reloader
  namespace: argocd
spec:
  project: platform
  sources:
    - repoURL: https://stakater.github.io/stakater-charts
      chart: reloader
      targetRevision: {{ .Values.versions.reloader }}
      helm:
        valueFiles:
          - $values/gitops/platform/reloader/values.yaml
    - repoURL: {{ .Values.repoURL }}
      targetRevision: {{ .Values.branch }}
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: reloader
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
