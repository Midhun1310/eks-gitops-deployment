# Creates the AWS load balancer (ALB) for every Ingress.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aws-load-balancer-controller
  namespace: argocd
spec:
  project: platform
  sources:
    - repoURL: https://aws.github.io/eks-charts
      chart: aws-load-balancer-controller
      targetRevision: {{ .Values.versions.awsLoadBalancerController }}
      helm:
        valueFiles:
          - $values/gitops/platform/aws-load-balancer-controller/values.yaml
        valuesObject:
          clusterName: {{ .Values.cluster.cluster_name }}
          region: {{ .Values.cluster.aws_region }}
          vpcId: {{ .Values.cluster.vpc_id }}
    - repoURL: {{ .Values.repoURL }}
      targetRevision: {{ .Values.branch }}
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
