# Monitoring: Prometheus + Grafana. values.yaml is shared, values-<env>.yaml adjusts size per environment.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: platform
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: {{ .Values.versions.kubePrometheusStack }}
      helm:
        valueFiles:
          - $values/gitops/platform/kube-prometheus-stack/values.yaml
          - $values/gitops/platform/kube-prometheus-stack/values-{{ .Values.cluster.environment }}.yaml
    - repoURL: {{ .Values.repoURL }}
      targetRevision: {{ .Values.branch }}
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
