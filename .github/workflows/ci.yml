name: ci

on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app/backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: app/backend/requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app/frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: app/frontend/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: CI=true npm test -- --watchAll=false
      - run: npm run build

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
      - run: helm lint helm/mk-app -f helm/mk-app/ci/test-values.yaml
      - name: Render and validate against the Kubernetes API schema
        run: |
          helm template mk helm/mk-app -n mk -f helm/mk-app/ci/test-values.yaml \
            | kubeconform -strict -ignore-missing-schemas -summary -kubernetes-version 1.35.0
      - name: Lint platform chart
        run: helm lint gitops/platform/cluster-config --set region=ap-south-1
      - name: Render the ArgoCD apps chart (dev and prod)
        run: |
          for env in dev prod; do
            helm template apps gitops/apps -f gitops/apps/values-$env.yaml -f gitops/apps/ci/test-values.yaml > /dev/null
          done

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.10.5" }
      - run: terraform fmt -check -recursive terraform
      - name: validate every root module
        run: |
          for d in terraform/bootstrap terraform/envs/dev terraform/envs/prod; do
            echo "::group::$d"
            terraform -chdir=$d init -backend=false -input=false
            terraform -chdir=$d validate
            echo "::endgroup::"
          done

  iac-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy config scan (Terraform, Helm, Dockerfiles, K8s manifests)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "0"   # report-only at first; flip to "1" once findings are triaged

