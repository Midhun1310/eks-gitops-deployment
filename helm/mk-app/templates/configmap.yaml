apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  labels:
    app.kubernetes.io/part-of: mk-platform
    environment: {{ .Values.environment }}
data:
  DB_HOST: {{ .Values.config.dbHost | quote }}
  DB_PORT: {{ .Values.config.dbPort | quote }}
  DB_NAME: {{ .Values.config.dbName | quote }}
  DB_SSLMODE: {{ .Values.config.dbSslmode | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  ALLOWED_ORIGINS: {{ .Values.config.allowedOrigins | quote }}
  FLASK_DEBUG: "0"
