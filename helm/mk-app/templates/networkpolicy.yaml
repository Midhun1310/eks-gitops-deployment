# Needs the VPC CNI network-policy feature (turned on in Terraform).
# 1) Deny all traffic to and from the mk pods by default.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  labels:
    app.kubernetes.io/part-of: mk-platform
    environment: {{ .Values.environment }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: mk-platform
  policyTypes:
    - Ingress
    - Egress
---
# 2) Allow the load balancer (inside the VPC) to reach the frontend and backend ports.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-load-balancer
  labels:
    app.kubernetes.io/part-of: mk-platform
    environment: {{ .Values.environment }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: mk-platform
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.vpcCidr }}
      ports:
        - port: {{ .Values.backend.port }}
          protocol: TCP
        - port: {{ .Values.frontend.port }}
          protocol: TCP
---
# 3) Backend and migration Job may only call DNS and PostgreSQL (RDS).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-to-database
  labels:
    app.kubernetes.io/part-of: mk-platform
    environment: {{ .Values.environment }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: ["backend", "migrate"]
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.vpcCidr }}
      ports:
        - port: 5432
          protocol: TCP
