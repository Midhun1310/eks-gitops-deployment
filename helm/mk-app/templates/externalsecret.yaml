# Copies credentials from AWS Secrets Manager into the Kubernetes Secret "app-secrets".
# The ClusterSecretStore "aws-secrets-manager" is created by gitops/platform/cluster-config.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-secrets
  labels:
    app.kubernetes.io/part-of: mk-platform
    environment: {{ .Values.environment }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"   # first: the Secret must exist before the migration Job
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: app-secrets
  data:
    - secretKey: DB_USERNAME
      remoteRef:
        key: {{ .Values.secrets.dbSecretId }}
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: {{ .Values.secrets.dbSecretId }}
        property: password
    - secretKey: SECRET_KEY
      remoteRef:
        key: {{ .Values.secrets.appSecretId }}
        property: secret_key
